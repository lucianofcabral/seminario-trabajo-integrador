[project]
name = "book-manager"
version = "0.1.0"
description = "Gestor de libros por terminal con almacenamiento en CSV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.12",
    "pycountry>=22.3",
    "pydantic[email]>=2.5",
]

[project.scripts]
book-manager = "book_manager.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
