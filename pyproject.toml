[project]
name = "book-manager"
version = "0.1.0"
description = "Gestor de libros por terminal sobre PostgreSQL con SQLAlchemy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.12",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pycountry>=22.3",
    "pydantic[email]>=2.5",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scrapy>=2.19.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
book-manager = "book_manager.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
